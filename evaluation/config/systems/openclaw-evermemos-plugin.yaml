name: "openclaw-evermemos-plugin"
version: "1.0"
description: "OpenClaw local agent with EverMemOS ContextEngine plugin"

adapter: "openclaw_evermemos_plugin"
benchmark_mode: "category1"
inspection_strength: "strong"
semantic_chunk_policy: "evermemos_plugin_generated_memories"
transport_batch_policy: "openclaw_context_engine_afterTurn_hook_per_session"
supported_datasets: ["subtlememory"]

num_workers: 1

openclaw:
  root: "${OPENCLAW_ROOT}"
  cli: "${OPENCLAW_CLI}"
  base_config_path: "${OPENCLAW_CONFIG_PATH}"
  memory_search_provider: "local"

plugin:
  id: "evermind-ai-everos"
  path: "evaluation/src/adapters/openclaw/plugins/evermemos_runtime"
  hook_runner_path: "evaluation/src/adapters/openclaw/assets/plugin_hook_runner.mjs"
  base_url: "${EVERMEMOS_API_URL:https://api.evermind.ai}"
  api_key: "${EVERMEMOS_API_KEY}"
  capture_strategy: "full_session"
  async_mode: true
  request_interval_ms: 1000
  max_retries: 5
  retry_base_ms: 1000
  retry_max_ms: 8000
  ssl_verify: false

memory:
  messages: 50
  search_top_k: 50
  min_score: 0.08

search:
  num_workers: 1
  top_k: 50

llm:
  provider: "openai"
  model: "${ANSWER_LLM_MODEL:gpt-4o-mini}"
  api: "openai-completions"
  api_key: "${ANSWER_LLM_API_KEY}"
  base_url: "${ANSWER_LLM_BASE_URL:https://api.openai.com/v1}"
  temperature: 0
  max_tokens: 16384

answer:
  num_workers: 2
  checkpoint_interval: 10
  max_retries: 2
  openclaw_max_retries: 5
  openclaw_retry_delay_seconds: 2
  openclaw_agent_timeout_seconds: 210
  openclaw_subprocess_timeout_seconds: 225
  use_openclaw_agent: true
  openclaw_agent_prompt_key: "answer_prompt_empty"
  allow_llm_fallback: false
  timeout_seconds: 1200

readiness:
  budget_seconds: 240
  poll_interval_seconds: 15
