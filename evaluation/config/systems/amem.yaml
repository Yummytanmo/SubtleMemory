# A-Mem System Configuration

name: "amem"
version: "1.0"
description: "A-Mem robust local memory adapter"

adapter: "amem"
benchmark_mode: "category1"
inspection_strength: "strong"
semantic_chunk_policy: "message"
transport_batch_policy: "message"

amem_repo_path: "${AMEM_REPO_PATH}"

# A-Mem native configuration.
llm_backend: "openai"
llm_model: "${OPENAI_MODEL:gpt-4o-mini}"
api_key: "${OPENAI_API_KEY}"
api_base: "${OPENAI_BASE_URL:https://api.openai.com/v1}"
openai_timeout_seconds: "${AMEM_OPENAI_TIMEOUT_SECONDS:45}"
openai_max_retries: "${AMEM_OPENAI_MAX_RETRIES:4}"

# The evaluation target records text-embedding-3-small as the configured
# embedding model. A-Mem's current robust layer still expects a local
# SentenceTransformer model name, so the actual retriever model is recorded
# separately in artifacts instead of silently pretending to call OpenAI
# embeddings.
configured_embedding_model: "text-embedding-3-small"
amem_retriever_model: "${AMEM_RETRIEVER_MODEL:all-MiniLM-L6-v2}"
embedding_backend: "a-mem-local-retriever"
allow_keyword_fallback: true
evo_threshold: 100
num_workers: 1

readiness:
  budget_seconds: 0
  poll_interval_seconds: 0

llm:
  provider: "openai"
  model: "${ANSWER_LLM_MODEL:gpt-4o-mini}"
  api_key: "${ANSWER_LLM_API_KEY}"
  base_url: "${ANSWER_LLM_BASE_URL:https://api.openai.com/v1}"
  temperature: 0
  max_tokens: 16384

search:
  mode: api
  top_k: 20
  num_workers: 1

answer:
  subtlememory_prompt_key: "v1_concise"
  max_retries: 3
  num_workers: "${AMEM_ANSWER_NUM_WORKERS:50}"
  timeout_seconds: "${AMEM_ANSWER_TIMEOUT_SECONDS:120}"

evaluation:
  fail_on_error: "${JUDGE_LLM_FAIL_ON_ERROR:true}"
