# Mem0 System Configuration

name: "mem0"
version: "1.0"
description: "Mem0"

adapter: "mem0"
benchmark_mode: "category1"
inspection_strength: "strong"
semantic_chunk_policy: "native_system"
transport_batch_policy: "batch_messages"

# Mem0 API configuration
api_key: "${MEM0_API_KEY}"
host: "${MEM0_HOST:https://api.mem0.ai}"
batch_size: 5  # Number of messages to batch per API call
max_retries: 5  # Number of retries for failed API calls
max_content_length: 8000  # Maximum content length per message (API limit)
add_interval: 0.5  # Seconds to wait between add requests (to avoid rate limits)

# Concurrency configuration
num_workers: 5  # Number of concurrent conversations to process

# Two-phase benchmark flow uses manual confirmation between `add` and
# `finalize search answer evaluate`, so add should not block on provider
# visibility polling by default.
post_add_wait_seconds: 0
post_add_wait_strategy: "fixed_sleep"
post_add_poll_interval_seconds: 15
post_add_stable_polls: 2
readiness:
  budget_seconds: 180
  poll_interval_seconds: 15

# LLM configuration (for answer generation)
llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${ANSWER_LLM_API_KEY}"
  base_url: "${ANSWER_LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 16384

# Search configuration
search:
  top_k: 20  # Number of results per user (in dual-perspective mode, total = 2 * top_k)
  search_interval: 0.5  # Seconds to wait between search requests (to avoid 429 errors)

# Answer configuration
answer:
  max_retries: 3
