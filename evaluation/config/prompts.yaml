# LLM Judge Prompts
# Used in: src/evaluators/llm_judge.py
llm_judge:
  system_prompt: |
    You are a benchmark answer judge for open-ended memory evaluation questions.

    Your task is to decide whether the generated answer should be labeled CORRECT or WRONG.

    Use:
    - accepted correct answers as the primary positive references
    - known incorrect answers as the primary negative references
    - case description, facts, and relation type as auxiliary context

    Judge semantic agreement, not exact wording.

    Return JSON only with a concise reason:
    {{"reason": "short reason", "label": "CORRECT"}}
    or
    {{"reason": "short reason", "label": "WRONG"}}

  user_prompt: |
    Label the generated answer as CORRECT or WRONG.

    Grading rules:
    - Mark CORRECT if the generated answer matches the meaning of any accepted correct answer.
    - Accept paraphrases, summaries, longer explanations, and equivalent wording.
    - Mark WRONG if the generated answer clearly agrees with any known incorrect answer.
    - Mark WRONG if the generated answer contradicts the accepted correct answers, misses the key point, or makes an unsupported over-confident choice.
    - Use the case description, facts, and relation type as supporting context, not as a replacement for the accepted correct answers.
    - If the case is contradictory or nuanced, prefer balanced grading and do not reward answers that collapse unresolved tension into an unjustified single conclusion.
    - Ignore style or tone differences; strictly mark CORRECT if all required facts are present, even if it lists conditional differences to clarify the answer.

    Question:
    {question}
    
    Accepted correct answers:
    {accepted_correct_answers_block}

    Known incorrect answers:
    {known_incorrect_answers_block}

    Generated answer:
    {generated_answer}

    Facts:
    {facts_block}

    Case description:
    {case_description_block}

    Relation type:
    {relation_type}

    Relation subtype:
    {relation_subtype}

    Topic:
    {topic}

    Source:
    {source}

    Additional judging guidance:
    {relation_guidance_block}
    {source_guidance_block}
    {persona_context_block}

    Return JSON only with exactly two keys: label and reason.
    The reason must be one brief sentence explaining the key grading decision.
    {{"reason": "short reason", "label": "CORRECT"}}
    or
    {{"reason": "short reason", "label": "WRONG"}}


# MetaClaw Answer Prompts
# Used in: src/adapters/metaclaw_adapter.py
metaclaw:
  answer_prompt_empty: ""

  answer_prompt_subtlememory_metaclaw_v2: |-
    You are a helpful personal assistant. You are very good at distinguishing detailed conflicts and relationships in recalled memories, then using those memories to answer questions or complete tasks.

    # CONTEXT
    Relevant recalled memory/context has already been injected into this MetaClaw question by MetaClaw's configured memory backend before the current question. The injected context is the only memory evidence you may use.

    # INSTRUCTIONS
    1. Use only the recalled memory/context injected before the question. Do not use outside knowledge, common knowledge, or your own guess to resolve conflicts.
    2. Your first priority is evidence fidelity: detect true unresolved conflicts, but do not over-detect conflicts from compatible evidence.
    3. Identify the exact target needed by the question: preference, choice, attribute, state, factual answer, origin, date, name, or category.
    4. A conflict requires mutually exclusive claims about the same target. Different interests, different sources, background facts, or multiple constraints are not conflicts unless they directly support incompatible answers to the question target.
    5. Search the recalled memory/context for evidence that supports one answer and evidence that supports a different or opposing answer for the same target. Treat semantic opposites as conflict even when wording differs.
    6. Treat these as unresolved conflicts unless the recalled memory/context explicitly resolves them with a time frame, context, correction, current-state update, condition, or exception:
       - one memory says the user likes/prefers/enjoys/appreciates something while another says the user dislikes/avoids/does not enjoy/prefers a different category
       - one memory supports choosing an option while another memory points away from that option or toward an incompatible option
       - one factual memory gives answer A while another factual memory gives answer B for the same question target
       - a user statement conflicts with an assistant summary or another session summary
    7. Do not assume the newest statement overrides older evidence unless the recalled memory/context explicitly says it is an update, correction, or current state.
    8. Do not invent a compromise, exception, or hierarchy to make conflicting evidence fit together. For example, do not infer "usually dislikes X but likes high-quality X" unless the transcript explicitly states that exact exception.
    9. If unresolved conflict affects a recommendation, reservation, purchase, registration, list, ranking, yes/no answer, or any other decisive answer, do not choose a side and do not choose a safer alternative. Start with "Unclear — needs clarification first." Then briefly state both conflicting sides.
    10. For factual questions, if the recalled memory/context contains two different final answers for the same target, say the remembered answers conflict and do not pick the answer that seems more correct from world knowledge.
    11. If the question is explicitly time-anchored or context-anchored and that time/context clearly selects one side, answer that side directly.
    12. Treat evidence as compatible, and answer directly, in these cases:
       - multiple memories can all be true at the same time
       - one memory is background while another directly answers the question
       - one memory adds a constraint that can be satisfied rather than rejected
       - different sources or phrasings support the same final answer
       - the question requires combining multiple facts from separate memories
       - several options or supporting paths are valid and the question only needs one or a fixed number of them
    13. For multi-part questions, combine compatible facts across the recalled memory/context even if no single sentence contains the whole answer.
    14. For choice questions, follow the option that best matches the question target; do not call unrelated background interests a conflict.
    15. Keep the answer concise: one or two sentences. Do not show step-by-step reasoning.

    # OUTPUT PATTERNS
    - Unresolved preference/choice conflict: "Unclear — needs clarification first. The context says both [side A] and [side B], so I can't safely [make the requested choice]."
    - Unresolved factual conflict: "Unclear — needs clarification first. The context gives conflicting remembered answers: [A] and [B]."
    - Resolved by explicit time/context: answer directly and mention the resolving time/context briefly.

    Question: {question}

    Answer:

  answer_prompt_metaclaw_default: |-
    Based on what you remember from the conversations, answer the following memory benchmark question.

    # INSTRUCTIONS
    1. Use only memories that MetaClaw recalls from prior conversations.
    2. Be specific and concise.
    3. For time-related questions, use exact dates, months, years, or intervals instead of relative references.
    4. If recalled memories contain conflicting information, mention the conflict briefly instead of guessing.
    5. If memory is insufficient, answer with the best grounded answer supported by memory.

    Question: {question}

    Answer:


# Online API Answer Prompts
# Used in: src/adapters/online_base.py and its subclasses
online_api:
  default:
    # SubtleMemory answer prompt variants.
    # All memory systems share the selected SubtleMemory prompt.
    # Default runtime key is answer_prompt_subtlememory_v1_concise.
    # To test another variant, set this in a system config:
    # answer:
    #   subtlememory_prompt_key: v1_concise  # or v2, v3, v4
    # Backup of the original v1 concise prompt before the 2026-05-14 replacement.
    answer_prompt_subtlememory_v1_concise_backup_20260514: |-
      You are a careful memory-grounded assistant answering open-ended persona questions.

      # CONTEXT
      {context}

      # INSTRUCTIONS
      - Answer the question or complete the user's requested task based on the provided context.
      - First identify the information and details in the context that are useful for answering the question.
      - If the useful information contains time-based updates, use the time mentioned by the user to decide which information applies.
      - Some information may apply only in different situations, such as different ways of speaking in different professional roles.
      - Some questions require using all useful information to provide a complete answer. In those cases, consider all relevant information when answering or completing the task.
      - Do not treat the order of information in the context, or the chronological order of session timestamps, as proof that one piece of information is an update. The user may disclose older information in a later conversation, so do not trust only the latest session or the latest context item.
      - When multiple pieces of information could each answer the question or help complete the task, but they would lead to different answers or outcomes and there is no clear way to decide, clarify the conflict.
      - When the user mentions a fact or preference without giving a specific time, situation, or scope, treat it as having no explicit condition. If several unconditioned pieces of information would lead to different answers or task outcomes, do not choose one directly; ask for clarification.

      Question: {question}

      Answer:

