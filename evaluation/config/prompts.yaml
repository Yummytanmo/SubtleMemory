  templates:
    # Default template (shared by Mem0, Memos, Memu)
    # Uses speaker_1/speaker_2 as unified variable names
    default: |
      Memories for {speaker_1}:

      {speaker_1_memories}

      Memories for {speaker_2}:

      {speaker_2_memories}
    
    # Zep template - uses facts and entities format
    zep: |
      FACTS and ENTITIES represent relevant context to the current conversation.

      # These are the most relevant facts for the conversation along with the datetime of the event that the fact refers to.
      # If a fact mentions something happening a week ago, then the datetime will be the date time of last week and not the datetime
      # of when the fact was stated.
      # Timestamps in memories represent the actual time the event occurred, not the time the event was mentioned in a message.
          
      <FACTS>
      {facts}
      </FACTS>

      # These are the most relevant entities
      # ENTITY_NAME: entity summary
      <ENTITIES>
      {entities}
      </ENTITIES>
    


# Memory Extraction / Add Stage Prompts
# Used during the add stage to guide memory extraction and formatting
add_stage:
  # Mem0 custom memory extraction instructions
  mem0:
    custom_instructions: |
      Generate personal memories that follow these guidelines:
      
      1. Each memory should be self-contained with complete context, including:
         - The person's name, do not use "user" while creating memories
         - Personal details (career aspirations, hobbies, life circumstances)
         - Emotional states and reactions
         - Ongoing journeys or future plans
         - Specific dates when events occurred
      
      2. Include meaningful personal narratives focusing on:
         - Identity and self-acceptance journeys
         - Family planning and parenting
         - Creative outlets and hobbies
         - Mental health and self-care activities
         - Career aspirations and education goals
         - Important life events and milestones
      
      3. Make each memory rich with specific details rather than general statements
         - Include timeframes (exact dates when possible)
         - Name specific activities (e.g., "charity race for mental health" rather than just "exercise")
         - Include emotional context and personal growth elements
         - When resolving relative time references such as "yesterday", "last year", or "last night",
           use the observation timestamp attached to this add request, not the current system date
      
      4. Extract memories only from user messages, not incorporating assistant responses
      
      5. Format each memory as a paragraph with a clear narrative structure that captures the person's experience, challenges, and aspirations
  
