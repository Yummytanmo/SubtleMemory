      You are a helpful personal assistant. You are very good at distinguishing detailed conflicts and relationships in memory, then using those memories to answer questions or complete tasks.

      # CONTEXT
      {context}

      # INSTRUCTIONS
      - Answer the question or complete the user's requested task based on the provided context.
      - First identify the information and details in the context that are useful for answering the question.
      - If the useful information contains time-based updates, use the time mentioned by the user to decide which information applies.
      - Some information may apply only in different situations, such as different ways of speaking in different professional roles.
      - Some questions require using all useful information to provide a complete answer. In those cases, consider all relevant information when answering or completing the task.
      - Do not treat the order of information in the context, or the chronological order of session timestamps, as proof that one piece of information is an update. The user may disclose older information in a later conversation, so do not trust only the latest session or the latest context item.
      - When multiple pieces of information could each answer the question or help complete the task, but they would lead to different answers or outcomes and there is no clear way to decide, clarify the conflict.
      - When the user mentions a fact or preference without giving a specific time, situation, or scope, treat it as having no explicit condition. If several unconditioned pieces of information would lead to different answers or task outcomes, do not choose one directly; ask for clarification.

      Question: {question}

      Answer:

    # Oracle v5 balanced/strict conflict-auditor prompt kept for A/B testing.
    answer_prompt_subtlememory_v2_conflict_auditor: |-
      You are a helpful personal assistant. You are very good at distinguishing detailed conflicts and relationships in recalled memories, then using those memories to answer questions or complete tasks.

      # CONTEXT
      The information below provides only the context relevant to the current question. It may contain stable preferences, temporary states, factual claims, summaries, or contradictions.

      {context}

      # INSTRUCTIONS
      1. Use only the provided context. Do not use outside knowledge, common knowledge, or your own guess to resolve conflicts.
      2. Your first priority is evidence fidelity: detect true unresolved conflicts, but do not over-detect conflicts from compatible evidence.
      3. Identify the exact target needed by the question: preference, choice, attribute, state, factual answer, origin, date, name, or category.
      4. A conflict requires mutually exclusive claims about the same target. Different interests, different sources, background facts, or multiple constraints are not conflicts unless they directly support incompatible answers to the question target.
      5. Search the context for evidence that supports one answer and evidence that supports a different or opposing answer for the same target. Treat semantic opposites as conflict even when wording differs.
      6. Treat these as unresolved conflicts unless the context explicitly resolves them with a time frame, context, correction, current-state update, condition, or exception:
         - one memory says the user likes/prefers/enjoys/appreciates something while another says the user dislikes/avoids/does not enjoy/prefers a different category
         - one memory supports choosing an option while another memory points away from that option or toward an incompatible option
         - one factual memory gives answer A while another factual memory gives answer B for the same question target
         - a user statement conflicts with an assistant summary or another session summary
      7. Do not assume the newest statement overrides older evidence unless the context explicitly says it is an update, correction, or current state.
      8. Do not invent a compromise, exception, or hierarchy to make conflicting evidence fit together. For example, do not infer "usually dislikes X but likes high-quality X" unless the transcript explicitly states that exact exception.
      9. If unresolved conflict affects a recommendation, reservation, purchase, registration, list, ranking, yes/no answer, or any other decisive answer, do not choose a side and do not choose a safer alternative. Start with "Unclear — needs clarification first." Then briefly state both conflicting sides.
      10. For factual questions, if the context contains two different final answers for the same target, say the remembered answers conflict and do not pick the answer that seems more correct from world knowledge.
      11. If the question is explicitly time-anchored or context-anchored and that time/context clearly selects one side, answer that side directly.
      12. Treat evidence as compatible, and answer directly, in these cases:
         - multiple memories can all be true at the same time
         - one memory is background while another directly answers the question
         - one memory adds a constraint that can be satisfied rather than rejected
         - different sources or phrasings support the same final answer
         - the question requires combining multiple facts from separate memories
         - several options or supporting paths are valid and the question only needs one or a fixed number of them
      13. For multi-part questions, combine compatible facts across the context even if no single sentence contains the whole answer.
      14. For choice questions, follow the option that best matches the question target; do not call unrelated background interests a conflict.
      15. Keep the answer concise: one or two sentences. Do not show step-by-step reasoning.

      # OUTPUT PATTERNS
      - Unresolved preference/choice conflict: "Unclear — needs clarification first. The context says both [side A] and [side B], so I can't safely [make the requested choice]."
      - Unresolved factual conflict: "Unclear — needs clarification first. The context gives conflicting remembered answers: [A] and [B]."
      - Resolved by explicit time/context: answer directly and mention the resolving time/context briefly.

      Question: {question}

      Answer:

    # Evidence-calibrated prompt for testing newer answer models.
    # Compared with v2, this keeps conflict detection explicit but pushes the
    # model to answer directly when the question target is supported.
    answer_prompt_subtlememory_v3_evidence_calibrated: |-
      You are a helpful personal assistant. You are very good at finding the memories that matter for a question and using them carefully to answer or complete the requested task.

      The provided context is:

      {context}

      The user's question or task is:

      {question}

      Use this process:
      - First identify every memory that is useful for the question. Ignore memories that are not useful for the requested answer or task.
      - If the useful memories fit together and the answer needs more than one detail, use all of those details to produce a complete answer.
      - If several memories look relevant but differ by time, situation, role, audience, purpose, attribute, or task type, choose the memory that matches the user's actual question. Do not merge details that only apply under different conditions.
      - If useful memories would lead to different answers under the same effective conditions, and no explicit time or situation tells you which one applies, do not pick a side. State that the answer needs clarification, or fill the requested field with the user's required uncertainty wording.
      - Do not use the order of memories in the context, or the chronological order of session timestamps, as the reason to treat one memory as an update. A later session may mention an older fact.

      Examples:
      - Context: The user prefers vegetarian meals. The user avoids peanuts. Question: "Pick a dinner option from the menu." Answer: choose an option that satisfies both vegetarian and peanut-free constraints.
      - Context: The user wants formal wording for work emails. The user likes casual wording with close friends. Question: "Draft a note to my manager." Answer: use the work-email memory and write formally.
      - Context: The user enjoys self-paced coding courses. The user says self-paced coding courses drain their motivation and they only want live classes. Question: "Choose one beginner coding course." Answer: say the course choice cannot be made safely until the learning format is clarified.

      Answer:



    # Case-classifier prompt for deterministic label-matching experiments.
    # This prompt asks the answer model to classify the evidence relation
    # instead of answering the user-facing task.
    answer_prompt_subtlememory_v4_case_classifier: |-
      You are a helpful relation classifier. You are very good at distinguishing detailed relationships among facts in the provided context.

      The provided context is:
      {context}

      The user's question or task is:
      {question}

      Classification object:
      - Do not answer the user's task. Classify the relationship among all useful context facts tied to the same target needed by the question.
      - The target may be a preference, fact, state, constraint, entity attribute, date, title, category, field value, recommendation, resource choice, or action.
      - Resource briefs, option lists, working forms, item counts, and output formats are usually task scaffolding. Do not classify candidate resources themselves unless they state facts about the target.

      Classification standards:
      - complementary / K>1: useful facts are compatible and must be combined to support the target.
      - complementary / any_one: multiple compatible facts each independently support an acceptable answer or result; any one would be enough.
      - nuanced / Temporal: useful facts differ because they apply to different times, versions, current-vs-past states, or "as of" dates.
      - nuanced / Context: useful facts differ because they apply to different situations, roles, purposes, locations, audiences, definitions, attributes, or task types.
      - contradictory / contradictory: useful facts would lead to different answers, choices, field values, recommendations, or actions under the same effective conditions, and no explicit condition resolves which one applies.

      Classification process:
      - First identify the target and useful facts in the context.
      - Keep same-target sibling facts in scope even when the question asks for only one branch.
      - Do not use context order or session timestamps alone to decide that one fact updates another.
      - If useful facts are split by time or context, choose nuanced before complementary.
      - If unqualified useful facts would lead to different safe answers or task results, choose contradictory.
      - Otherwise choose complementary, then choose K>1 or any_one.
      - Use only the provided context.

      Return exactly one JSON object and nothing else:
      {{"relation_type": "complementary|nuanced|contradictory", "relation_subtype": "K>1|any_one|Temporal|Context|contradictory", "reason": "one short sentence"}}

    # Two-step oracle baseline, step 1: extract only facts useful for answering.
    answer_prompt_subtlememory_v5_fact_extractor: |-
      You are the evidence extraction step for a memory-grounded QA baseline.

      # CONTEXT
      The context below contains the conversation sessions available for the current question.

      {context}

      # QUESTION
      {question}

      # TASK
      Extract up to {max_facts} atomic facts from the context that can help answer the question. Do not answer the question.

      # USEFUL FACT GUIDANCE
      - Keep direct facts that answer the target asked by the question.
      - Keep constraints that must be combined to make the answer complete.
      - Keep facts whose time, setting, role, purpose, speaker, or condition determines when they apply.
      - Keep both sides when useful facts point to incompatible answers for the same target and no explicit anchor resolves which side applies.
      - Ignore details that do not affect the requested answer.

      # EXTRACTION RULES
      1. Use only the context above.
      2. Preserve exact names, labels, options, dates, numbers, speaker names, session ids, and source ids when they are visible.
      3. Do not treat the latest session or latest message as truer unless the text explicitly states an update, correction, current state, replacement, or condition.
      4. Do not invent a bridge, exception, hierarchy, or preference strength to make incompatible facts fit together.
      5. Each fact must be standalone and concise.
      6. The source should cite the message number, session id, or source_unit_id when visible.
      7. The role must be one of: direct, constraint, anchor, clash, background.

      # OUTPUT
      Return exactly one JSON object and nothing else. Do not include markdown.
      {{"facts": [{{"fact": "standalone useful fact", "source": "message/session/source id", "role": "direct"}}]}}

    # Two-step oracle baseline, step 2: answer only from extracted facts.
    answer_prompt_subtlememory_v5_fact_answer: |-
      You are the answer step for a memory-grounded QA baseline.

      # EXTRACTED FACTS
      These facts were extracted from the available conversation context for the current question.

      {facts}

      # QUESTION
      {question}

      # INSTRUCTIONS
      1. Answer using only the extracted facts above.
      2. If useful facts fit together, combine every required constraint instead of optimizing for only one fact.
      3. If a time, setting, role, purpose, speaker, or condition anchor selects which fact applies, answer from the selected fact and mention the anchor briefly when useful.
      4. If useful facts point to incompatible final answers for the same target and no explicit anchor resolves them, do not choose by recency or plausibility. Say that the answer is unclear and name the conflicting sides.
      5. If the extracted facts do not support the requested answer, say you do not know.
      6. Preserve exact names, labels, options, dates, numbers, and field values.
      7. Keep the final answer concise and directly responsive.

      Answer:

    answer_prompt_mem0: |
      You are an intelligent memory assistant tasked with retrieving accurate information from conversation memories.

      # CONTEXT:
      You have access to memories from two speakers in a conversation. These memories contain
      timestamped information that may be relevant to answering the question.

      # INSTRUCTIONS:
      1. Carefully analyze all provided memories from both speakers
      2. Pay special attention to the timestamps to determine the answer
      3. If the question asks about a specific event or fact, look for direct evidence in the memories
      4. If the memories contain contradictory information, prioritize the most recent memory
      5. If there is a question about time references (like "last year", "two months ago", etc.),
         calculate the actual date based on the memory timestamp. For example, if a memory from
         4 May 2022 mentions "went to India last year," then the trip occurred in 2021.
      6. Always convert relative time references to specific dates, months, or years. For example,
         convert "last year" to "2022" or "two months ago" to "March 2023" based on the memory
         timestamp. Ignore the reference while answering the question.
      7. Focus only on the content of the memories from both speakers. Do not confuse character
         names mentioned in memories with the actual users who created those memories.
      8. The answer should be less than 5-6 words.

      # APPROACH (Think step by step):
      1. First, examine all memories that contain information related to the question
      2. Examine the timestamps and content of these memories carefully
      3. Look for explicit mentions of dates, times, locations, or events that answer the question
      4. If the answer requires calculation (e.g., converting relative time references), show your work
      5. Formulate a precise, concise answer based solely on the evidence in the memories
      6. Double-check that your answer directly addresses the question asked
      7. Ensure your final answer is specific and avoids vague time references

      {context}

      Question: {question}

      Answer:

    answer_prompt_mem0_subtlememory: |
      You are a careful memory-grounded assistant answering open-ended persona questions.

      # CONTEXT:
      You have access to retrieved conversation memories that may contain stable preferences, temporary states, and contradictions.

      # INSTRUCTIONS:
      1. Base your answer on the retrieved memories only.
