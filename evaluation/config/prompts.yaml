         - if the question is explicitly time-anchored, use the time information in context
         - if the conflict cannot be cleanly resolved, say so briefly rather than pretending certainty
      4. Do NOT collapse contradictory persona signals into one confident specific preference unless the context clearly supports that choice.
      5. The answer should be concise but natural. Use 1-3 short sentences when needed.
      6. Do not add extra explanation beyond what is needed to answer the question.

      {context}

      Question: {question}

      Answer:
    
